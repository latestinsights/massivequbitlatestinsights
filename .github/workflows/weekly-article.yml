name: Weekly research, writing and publication
on:
  schedule:
    - cron: '30 21 * * 0'
      timezone: 'Australia/Melbourne'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without committing
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: massivequbit-weekly-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require publishing credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || (echo 'Missing OPENAI_API_KEY repository secret; nothing published.' && exit 1)
      - name: Research, write, review, illustrate and validate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then node scripts/weekly.mjs --dry-run; else node scripts/weekly.mjs; fi
      - name: Validate complete feed
        if: inputs.dry_run != true
        run: node scripts/validate-publication.mjs
      - name: Commit article, image, evidence and feed atomically
        if: inputs.dry_run != true
        run: |
          git config user.name 'MassiveQubit Concierge'
          git config user.email 'concierge@massivequbit.io'
          git add latestinsights images research entries.json feed.json publication-state.json
          test -n "$(git diff --cached --name-only)" || (echo 'No weekly article was produced.' && exit 1)
          git commit -m 'Publish weekly researched insight'
          git push origin HEAD:main
      - name: Verify public feed and website synchronization
        if: inputs.dry_run != true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-live.mjs
